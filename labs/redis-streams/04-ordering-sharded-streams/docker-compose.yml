services:
  redis:
    image: redis:7-alpine
    ports:
      - "6383:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  unordered-producer-api:
    build: .
    ports:
      - "18200:8080"
    environment:
      APP_ROLE: producer
      APP_MODE: unordered
      APP_PRODUCER_NAME: unordered-producer-api
      APP_STREAM_NAME: order-events
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s

  unordered-worker-1:
    build: .
    ports:
      - "18201:8080"
    environment:
      APP_ROLE: worker
      APP_MODE: unordered
      APP_STREAM_NAME: order-events
      APP_GROUP_NAME: billing
      APP_CONSUMER_NAME: billing-worker-1
      APP_ORDER_CREATED_DELAY_MS: ${UNORDERED_ORDER_CREATED_DELAY_MS:-3000}
      APP_ORDER_PAID_DELAY_MS: ${UNORDERED_ORDER_PAID_DELAY_MS:-100}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
